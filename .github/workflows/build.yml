name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with this tag (for example v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Tests
        # Includes the browser integration tests that use the real pipe,
        # registry and folders of the runner's user.
        env:
          AUTH_TEST_SYSTEM: "1"
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test (starts and keeps running)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          $p = Start-Process -FilePath target\release\authenticator.exe -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { throw "The app exited early with code $($p.ExitCode)" }
          $mb = [math]::Round($p.WorkingSet64 / 1MB, 1)
          Write-Host "Running OK, working set: $mb MB"
          Stop-Process -Id $p.Id

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\dist | Out-Null
          Copy-Item target\release\authenticator.exe ..\dist\Authenticator.exe
          Get-FileHash ..\dist\Authenticator.exe -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: Authenticator-Windows
          path: dist/Authenticator.exe
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (shared vectors with Windows)
        run: ./gradlew -p core test --console=plain

      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
            echo "ANDROID_KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"
            echo "Release key found: the APK will be signed with it."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a temporary debug key (see README, 'Chave de assinatura')."
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Check that the app has no internet permission
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The APK requests INTERNET permission"
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/Authenticator.apk
          sha256sum ../dist/Authenticator.apk
          rm -f release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: Authenticator-Android
          path: dist/Authenticator.apk
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        env:
          SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cat > notes.md <<'EOF'
          ## What's new in 2.0

          - **Passwords**: save website logins next to your 2FA codes, with a password generator and a link from each login to its 2FA code. On Windows you can also import a CSV exported from your browser.
          - **Browser extension** (Windows): fills in the user name, password and 2FA code on websites. It talks only to the app on the same PC and only while the app is unlocked; when it is locked, the app comes up and asks for your PIN. Shortcut: Ctrl+Shift+U.
          - **New Windows window** in the style of a desktop password manager (menus, list with details, keyboard shortcuts).
          - **Windows notification area**: closing the window keeps the app running there; optional start with Windows; locks when Windows locks.
          - **Export a single code** as a QR code, and **choose** which codes and passwords go into an export or backup. Backups now include passwords, and restoring merges them with what you already have.

          ## Downloads

          - **Windows** (10/11): `Authenticator.exe`. No installer: just open it. SmartScreen may warn because the file is not code-signed: "More info" → "Run anyway".
            The browser extension (Thorium, Chrome, Edge, Brave…) is inside it: in the app, Tools → Browser integration.
          - **Android** (8.0+): `Authenticator.apk`. Allow installing unknown apps for the browser or file manager that opens it.

          Both apps work fully offline and read each other's encrypted backup files. See the README for importing from Google Authenticator.
          EOF
          if [ "$SIGNED" != "true" ]; then
            cat >> notes.md <<'EOF'

          > [!WARNING]
          > This APK is signed with a temporary key. A future version will not install over it without uninstalling first (which deletes the accounts). Before relying on it, create a signing key (README, "Chave de assinatura do Android") and always keep an encrypted backup.
          EOF
          fi
          printf "\nSHA-256:\n\n" >> notes.md
          (cd dist && sha256sum Authenticator.exe Authenticator.apk | sed 's/^/    /') >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          # Tag pushes use their own tag; manual runs create the tag on this commit.
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Authenticator ${{ inputs.release || github.ref_name }}
          body_path: notes.md
          files: |
            dist/Authenticator.exe
            dist/Authenticator.apk
